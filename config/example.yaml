pmd:
  mode: physical

interfaces:
  lan: 
    name: ens19
    pcie_addr: "0000:00:13.0"
    ip: 10.0.10.1
  wan: 
    name: ens20
    pcie_addr: "0000:00:14.0"
    ip: 10.0.20.1

ips:
  lan: 10.0.10.1/24
  wan: 10.0.20.1/24


nat:
  hairpin: true
  dnat:
    - port: 2222
      to: 10.0.10.2:22
      protocol: 0 # tcp/udp/0
    - port: 8080
      to: 10.0.10.2:8000
      protocol: 0

timeouts:
  tcp:
    established: 300
    transitory: 30
  udp: 30
  icmp: 10


workers:
  lcores: [1,2]

arp:
  cache_size: 4096
  reachable_ms: 30000
  stale_ms: 120000
  request_interval_ms: 1000
  max_retries: 5
  max_pending_per_neighbor: 32
  gratuitous_on_start: 2

metrics:
  enabled: true
  addr: 0.0.0.0
  port: 9109